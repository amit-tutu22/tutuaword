name: tutuaword
description: AI-native document editor — Flutter UI shell
publish_to: 'none'
version: 26.08.01+260801

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  # 11.x skips the Kotlin Android plugin under AGP 9 when builtInKotlin=false
  # (Flutter template default), so FilePickerPlugin never compiles. 12 beta
  # applies Kotlin when built-in Kotlin is off. Pin until 12 stable ships.
  file_picker: 12.0.0-beta.7
  path: ^1.9.0
  archive: ^4.0.9
  share_plus: ^13.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  # Use CocoaPods for iOS plugins. Flutter's SPM wrapper regenerates at iOS 13.0
  # on every `pub get`, which breaks file_picker (requires 14.0) when opening
  # Xcode before `flutter build ios`. CocoaPods + platform :ios, '14.0' is stable.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/templates/
    - assets/icon/
    - assets/legal/
