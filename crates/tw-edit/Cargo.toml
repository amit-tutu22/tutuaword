[package]
name = "tw-edit"
description = "Document mutations, undo/redo, single mutation entry point"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tw-model = { path = "../tw-model" }
tw-text = { path = "../tw-text" }
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Portable monotonic clock: `std::time::Instant::now` panics on wasm32-unknown-unknown.
web-time = "1.1"
regex = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tw-native = { path = "../tw-native" }
tw-docx = { path = "../tw-docx" }
tw-spell = { path = "../tw-spell" }
