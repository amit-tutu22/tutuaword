[package]
name = "tw-render"
description = "Display list builder and binary serialization"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tw-layout = { path = "../tw-layout" }
tw-shape = { path = "../tw-shape" }
tw-model = { path = "../tw-model" }
# R3.3: vector rasterization lives in the render layer, not tw-docx.
resvg = { version = "0.44", default-features = false, features = ["text", "raster-images"] }
usvg = { version = "0.44", default-features = false, features = ["text"] }
tiny-skia = { version = "0.11", features = ["png"] }

[dev-dependencies]
tw-model = { path = "../tw-model" }